analyzer:
  errors:
    invalid_annotation_target: ignore
  exclude:
    # ignore warnings in files from json_serializable, built_value and most generators
    - "**/*.g.dart"
    # ignore warnings in files generated by Freezed specifically.
    - "**/*.freezed.dart"
    # ignore warnings in files boilerplate.
    - _boilerplate_sourcecode/**
    # build/ can end up holding full copies of pub packages (incl. their own
    # example apps) via SPM resolution — never part of this project's code.
    - build/**